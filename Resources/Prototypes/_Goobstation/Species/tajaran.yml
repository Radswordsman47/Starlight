- type: species
  id: Tajaran
  name: species-name-tajaran
  roundStart: true
  prototype: MobTajaran
  sprites: MobTajaranSprites
  markingLimits: MobTajaranMarkingLimits
  dollPrototype: MobTajaranDummy
  skinColoration: Hues # Omustation Edit - Tajara can be any color
  maleFirstNames: NamesTajaranFirst
  femaleFirstNames: NamesTajaranFirst
  lastNames: NamesTajaranLast
  # begin Goobstation: port EE height/width sliders
  minHeight: 0.75
  defaultHeight: 0.80
  maxHeight: 1.15
  minWidth: 0.80
  defaultWidth: 0.80
  maxWidth: 1.10
  # end Goobstation: port EE height/width sliders

- type: markingPoints
  id: MobTajaranMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ TajaranTailRetro ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ TajaranEarsBasic ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 6
      required: false
    Legs:
      points: 6
      required: false

